name: kimai
summary: Kimai
description: Time tracking for project-driven teams
grade: stable

apps:
  mariadb:
    user: kimai
    command: bin/service.mariadb.sh
    daemon: simple
    restart-condition: always
    start-timeout: 600s
    restart-delay: 10s
    before: [server]

  server:
    user: kimai
    command: bin/service.php-fpm.sh
    daemon: simple
    restart-condition: always
    start-timeout: 600s
    restart-delay: 10s
    before: [nginx]

  nginx:
    user: kimai
    command: bin/service.nginx.sh
    daemon: simple
    restart-condition: always
    start-timeout: 600s
    restart-delay: 10s

  cli:
    command: bin/cli

  sql:
    command: bin/mysql

  php:
    command: bin/php.sh

  console:
    command: bin/console.sh

  storage-change:
    command: bin/cli storage-change

  access-change:
    command: bin/cli access-change

  backup-pre-stop:
    command: bin/cli backup-pre-stop

  restore-pre-start:
    command: bin/cli restore-pre-start

  restore-post-start:
    command: bin/cli restore-post-start
