apps:

  server:
    user: kimai
    command: bin/service.php-fpm.sh
    daemon: simple
    plugs:
    - network
    - network-bind
    start-timeout: 600s
    restart-condition: always

  mariadb:
    user: kimai
    command: bin/service.mariadb.sh
    daemon: simple
    plugs:
    - network
    - network-bind
    restart-condition: always

  nginx:
    user: kimai
    command: bin/service.nginx.sh
    daemon: simple
    plugs:
    - network
    - network-bind
    restart-condition: always
    start-timeout: 600s

  cli:
    command: bin/cli

  sql:
    command: bin/mysql

  php:
    command: bin/php.sh

  console:
    command: bin/console.sh

  storage-change:
    command: bin/cli storage-change

  access-change:
    command: bin/cli access-change

  backup-pre-stop:
    command: bin/cli backup-pre-stop

  restore-pre-start:
    command: bin/cli restore-pre-start

  restore-post-start:
    command: bin/cli restore-post-start

confinement: strict
description: kimai
grade: stable
name: kimai
summary: kimai
