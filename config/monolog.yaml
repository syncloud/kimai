monolog:
    channels: ["deprecation"]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: console
                excluded_http_codes:
                    - {400: ['^/api/']}
                    - {401: ['^/api/']}
                    - 403
                    - 404
                    - {405: ['/homepage$', '/login_check$', '/export/data$']}
                channels: ["!deprecation"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!deprecation"]
